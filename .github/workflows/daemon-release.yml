name: Daemon Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        working-directory: daemon
        run: cross build --release --target ${{ matrix.target }} -p propulse-daemon

      - name: Package
        run: |
          mkdir -p dist
          cp "daemon/target/${{ matrix.target }}/release/propulse-daemon" "dist/propulse-daemon-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: propulse-daemon-${{ matrix.target }}
          path: dist/propulse-daemon-${{ matrix.target }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: daemon
        run: cargo build --release -p propulse-daemon

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "daemon/target/release/propulse-daemon.exe" "dist/propulse-daemon-x86_64-pc-windows-msvc.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: propulse-daemon-x86_64-pc-windows-msvc
          path: dist/propulse-daemon-x86_64-pc-windows-msvc.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build (x86_64)
        working-directory: daemon
        run: cargo build --release --target x86_64-apple-darwin -p propulse-daemon

      - name: Build (aarch64)
        working-directory: daemon
        run: cargo build --release --target aarch64-apple-darwin -p propulse-daemon

      - name: Lipo universal binary
        run: |
          mkdir -p dist
          lipo -create \
            "daemon/target/x86_64-apple-darwin/release/propulse-daemon" \
            "daemon/target/aarch64-apple-darwin/release/propulse-daemon" \
            -output "dist/propulse-daemon-macos-universal"
          chmod +x "dist/propulse-daemon-macos-universal"

      - uses: actions/upload-artifact@v4
        with:
          name: propulse-daemon-macos-universal
          path: dist/propulse-daemon-macos-universal

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

