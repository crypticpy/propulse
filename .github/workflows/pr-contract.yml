name: pr-contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # The design-review gate's evidence is a PR comment. Posting, editing or
  # deleting one fires no pull_request event, so the last check result would
  # stay green after an approval is retracted. An issue_comment run attaches
  # to the default branch, not the PR head, so it cannot report the check
  # itself; the rerun job below re-runs the latest pull_request run for the
  # head instead (that run reads comments live), which replaces its result.
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  body:
    name: pr-contract
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check PR body contract
        env:
          BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(closes|fixes|resolves|refs|part of)\s+#[0-9]+'; then
            echo "PR body needs \`Closes #N\` or \`Refs #N\` (see docs/AGENT-CONSTITUTION.md Pull requests)"
            exit 1
          fi
          # strip HTML comments so the template's examples cannot satisfy the check
          STRIPPED=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          if ! printf '%s' "$STRIPPED" | grep -Eiq '^\s*\**Agent\**:\s*\S'; then
            echo "PR body needs an \`Agent:\` line with a value after the colon (e.g. \`Agent: Codex\`)"
            exit 1
          fi
          if [ "${CHANGED_FILES:-0}" -gt 15 ]; then
            echo "::warning::PR touches ${CHANGED_FILES} files, over the 15-file guideline"
          fi
      - name: Require a Fable design review on UI changes
        # Rule and path list: docs/AGENT-CONSTITUTION.md, "Design and UI review".
        # The list here is a floor (what CI can see), not the definition.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') \
            || { echo "::error::could not list PR files; the design-review gate cannot be evaluated (re-run the check)"; exit 1; }
          # Everything under src/ is UI unless it is a test, a type declaration
          # or one of the non-visual libraries listed here; style, token,
          # presentation, preset and glyph modules count wherever they live.
          # A path list of UI directories was a floor Codex kept finding gaps
          # in (#896 rounds 2-14: stores, hooks, config, constants, data);
          # an exclusion list fails closed instead.
          UI=$(printf '%s\n' "$FILES" \
            | grep -E '^(src/|index\.html$|public/|tailwind\.config\.|postcss\.config\.|\.design-sync/|docs/designs/)' \
            | grep -vE '(\.test\.tsx?$|^src/test/|^src/types/|^src/vite-env\.d\.ts$|^src/lib/(db|audio|sync|api|adif|export|migrations|errors|dev|pwa|wspr|services)/|^src/lib/supabase\.ts$)' \
            || true)
          NAMED=$(printf '%s\n' "$FILES" \
            | grep -E '^src/.*(Colou?rs?|Layout|Tokens?|Fonts?|Styles?|Appearance|[Pp]resentation|[Pp]resets?|[Gg]lyphs?)\.tsx?$' \
            | grep -vE '\.test\.tsx?$' || true)
          UI=$(printf '%s\n%s\n' "$UI" "$NAMED" | grep -v '^$' | sort -u || true)
          if [ -z "$UI" ]; then
            echo "No UI paths changed; design review not required."
            exit 0
          fi
          echo "UI paths changed:"
          printf '%s\n' "$UI"
          # The proof is the reviewer's **design review** comment, bound to this
          # head by its `Reviewed: <sha>` line; the PR body is author-controlled
          # and a later push would leave a stale body line in place. The comment
          # must come from an account Fable sessions post as (REVIEWERS) and
          # carry the `agent: Claude Fable` line; GitHub cannot prove which
          # model wrote a comment, so forging one is a hard-rule violation
          # (docs/AGENT-CONSTITUTION.md, Hard rules), not a CI gap.
          REVIEWERS='^(crypticpy|propulse-bot\[bot\])$'
          HEAD7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          COMMENTS=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | [.html_url, .user.login, (.body | @base64)] | @tsv') \
            || { echo "::error::could not list PR comments; the design-review gate cannot be evaluated (re-run the check)"; exit 1; }
          APPROVED=$(printf '%s\n' "$COMMENTS" | while IFS=$'\t' read -r url login b64; do
              [ -n "$b64" ] || continue
              printf '%s' "$login" | grep -Eq "$REVIEWERS" || continue
              body=$(printf '%s' "$b64" | base64 -d)
              if printf '%s' "$body" | grep -Eiq '\*\*design review\*\*' \
                && printf '%s' "$body" | grep -Eiq '^[[:space:]>*_-]*agent[*_]*:.*Claude Fable' \
                && printf '%s' "$body" | grep -Eiq "^[[:space:]>*_-]*Reviewed[*_]*:[[:space:]*_\`]*${HEAD7}" \
                && printf '%s' "$body" | grep -Eiq '^[[:space:]>*_-]*Verdict[*_]*:[[:space:]*_`]*approved[*_`]*([[:space:]]*\([^)]*\))?[[:space:]*_`.]*$'; then
                echo "$url"
              fi
            done)
          if [ -z "$APPROVED" ]; then
            echo "This PR touches UI. It needs a **design review** comment from a Fable-posting account (crypticpy or propulse-bot) with an \`agent: Claude Fable …\` line, \`Reviewed: ${HEAD7} …\` and \`Verdict: approved\` (docs/AGENT-CONSTITUTION.md, Design and UI review). A review of an earlier head does not carry."
            exit 1
          fi
          echo "Design review approved for ${HEAD7}: ${APPROVED}"
  rerun-on-design-review-comment:
    name: re-run pr-contract when a design-review comment changes
    # Only the accounts whose design-review comments the body job accepts
    # (REVIEWERS above) may trigger the rerun; any other commenter writing
    # `**design review**` would otherwise be able to re-run the required
    # check at will (Codex, #896 round 15).
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["crypticpy","propulse-bot[bot]"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the latest pr-contract run for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # On `edited`, the body before the edit: an edit that strips the
          # heading itself must still re-run, or a retracted approval would
          # keep its green (empty for created/deleted).
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
        run: |
          if ! printf '%s\n%s' "$COMMENT_BODY" "$PREVIOUS_BODY" | grep -Eiq '\*\*design review\*\*'; then
            echo "Neither the current nor the previous comment body is a design review; nothing to re-run."
            exit 0
          fi
          # Every lookup fails closed: an API error here must not read as
          # "no run to re-run", or a retracted approval keeps its green.
          HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.head.sha') \
            || { echo "::error::could not read the PR head; re-run this job"; exit 1; }
          [ -n "$HEAD_SHA" ] || { echo "::error::empty PR head sha; re-run this job"; exit 1; }
          RUN_ID=$(gh api "repos/${REPO}/actions/workflows/pr-contract.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=1" \
            --jq '.workflow_runs[0].id // empty') \
            || { echo "::error::could not list pr-contract runs for ${HEAD_SHA}; re-run this job"; exit 1; }
          if [ -z "$RUN_ID" ]; then
            echo "No pull_request run for ${HEAD_SHA} yet; the next push or body edit evaluates the comment."
            exit 0
          fi
          # A run that is still executing may already have fetched the
          # comments, so it cannot be trusted to see this change: wait for it
          # to finish, then re-run it (the check itself takes seconds).
          for _ in $(seq 1 60); do
            STATUS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.status') \
              || { echo "::error::could not read run ${RUN_ID}; re-run this job"; exit 1; }
            [ "$STATUS" = "completed" ] && break
            sleep 10
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::run ${RUN_ID} still ${STATUS} after 10 minutes; re-run this job"
            exit 1
          fi
          gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun" >/dev/null \
            || { echo "::error::could not re-run pr-contract run ${RUN_ID}; re-run this job"; exit 1; }
          echo "Re-ran pr-contract run ${RUN_ID} for ${HEAD_SHA}"
