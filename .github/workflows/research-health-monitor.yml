name: Research health monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: research-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MONITOR_ENDPOINT: ${{ secrets.PROPULSE_RESEARCH_HEALTH_MONITOR_ENDPOINT }}
      MONITOR_SECRET: ${{ secrets.PROPULSE_RESEARCH_HEALTH_MONITOR_SECRET }}
      PREVIEW_BYPASS: ${{ secrets.PROPULSE_RESEARCH_HEALTH_BYPASS_SECRET }}
    steps:
      - name: Check out monitor reconciler
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check private research heartbeat
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MONITOR_ENDPOINT}" || -z "${MONITOR_SECRET}" ]]; then
            jq -n '{monitorUnavailable: true}' \
              > /tmp/research-health-monitor.json
            exit 0
          fi
          args=(
            --fail-with-body
            --silent
            --show-error
            --max-time 20
            --retry 6
            --retry-delay 10
            --retry-max-time 90
            --retry-all-errors
            --request POST
            --header "Authorization: Bearer ${MONITOR_SECRET}"
            --header "Accept: application/json"
          )
          if [[ -n "${PREVIEW_BYPASS}" ]]; then
            args+=(--header "X-Vercel-Protection-Bypass: ${PREVIEW_BYPASS}")
          fi
          if ! curl "${args[@]}" \
            --output /tmp/research-health-monitor-response.json \
            "${MONITOR_ENDPOINT}"; then
            jq -n '{monitorUnavailable: true}' \
              > /tmp/research-health-monitor.json
            exit 0
          fi
          mv /tmp/research-health-monitor-response.json \
            /tmp/research-health-monitor.json
          if ! jq \
            '{evaluated, heartbeatStale, stateChanged, heartbeatAgeSeconds, alertDelivery}' \
            /tmp/research-health-monitor.json; then
            echo "Monitor response was not valid JSON; incident fallback will handle it" >&2
          fi

      - name: Reconcile durable GitHub incident
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/reconcile-research-health-issue.mjs \
            /tmp/research-health-monitor.json \
            | tee /tmp/research-health-issue.json

      - name: Enforce healthy monitor state
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.healthy == true' /tmp/research-health-issue.json >/dev/null
