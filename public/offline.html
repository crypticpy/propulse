<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>Propulse - Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a1a;
        color: #e5e7eb;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .container { max-width: 420px; }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: #f3f4f6;
      }
      p {
        font-size: 0.938rem;
        line-height: 1.6;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon" aria-hidden="true">&#x1F4E1;</div>
      <h1>You're offline</h1>
      <p>Propulse will be available when you reconnect.</p>
    </div>
  </body>
</html>
